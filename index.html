<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon App Supabase</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Outfit',sans-serif;background:radial-gradient(ellipse at 50% 0%, #1f1f1f 0%, #121212 70%);color:#fff}
  .glass{backdrop-filter:blur(10px);background:rgba(255,255,255,0.05);border-radius:12px;padding:12px;margin-bottom:12px}
  button{cursor:pointer;border:none;border-radius:6px;background-color:var(--red,#ef4444);color:#fff;padding:6px 12px;font-weight:600}
  input,textarea{padding:6px 10px;border-radius:6px;border:1px solid #555;background:#1e1e1e;color:#fff;font-family:'Outfit',sans-serif}
  .spinner{border:2px solid rgba(255,255,255,0.2);border-top:2px solid #fff;border-radius:50%;width:16px;height:16px;animation:spin 0.8s linear infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .particle{position:absolute;width:6px;height:6px;background:#ef4444;border-radius:50%;opacity:0.7;animation-name:rise;animation-iteration-count:infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0.7}100%{transform:translateY(-300px);opacity:0}}
  .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:1000}
  .modal-overlay.active{display:flex}
  .modal-content{background:#1e1e1e;padding:20px;border-radius:12px;max-width:400px;width:90%}
</style>
</head>
<body>
  <!-- Profil -->
  <div class="glass" style="margin:12px;">
    <h2 id="profileName">Nom du Profil</h2>
    <p id="profileBio">Bio du profil</p>
    <button id="userBtn">Profil</button>
  </div>

  <!-- Feed -->
  <div id="feedContainer" style="margin:12px;"></div>
  <div id="emptyState" class="glass" style="display:none;text-align:center;">Aucun contenu</div>

  <!-- Modals -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Connexion</h3>
      <input type="text" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Mot de passe">
      <button id="loginSubmitBtn">Se connecter</button>
      <p>Pas de compte ? <a href="#" id="switchRegisterBtn">S'inscrire</a></p>
    </div>
  </div>
  <div id="registerModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Inscription</h3>
      <input type="text" id="registerName" placeholder="Nom">
      <input type="text" id="registerBio" placeholder="Bio">
      <input type="text" id="registerEmail" placeholder="Email">
      <input type="password" id="registerPassword" placeholder="Mot de passe">
      <button id="registerSubmitBtn">S'inscrire</button>
      <p>Déjà un compte ? <a href="#" id="switchLoginBtn">Se connecter</a></p>
    </div>
  </div>

  <!-- Particles -->
  <div id="particleContainer" style="position:fixed;bottom:0;left:0;width:100%;height:100%;pointer-events:none;"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SUPABASE_URL = 'https://ccmjvekzbiykpbkzewic.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ispkTp-HmjtkM3Q6O1d39A_zLyOFOIC';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const State = { user:null, posts:[], comments:[], missions:[], rewards:[] };

// ===== Config Design =====
function applyConfig(){
  document.body.style.background='radial-gradient(ellipse at 50% 0%, #1f1f1f 0%, #121212 70%)';
  document.documentElement.style.setProperty('--red','#ef4444');
}

// ===== Particles =====
function initParticles(){
  const c=document.getElementById('particleContainer');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=Math.random()*4+'s';
    p.style.animationDuration=(3+Math.random()*3)+'s';
    c.appendChild(p);
  }
}

// ===== Auth =====
async function login(email,password){
  const { data, error } = await supabase.auth.signInWithPassword({ email,password });
  if(error){alert(error.message);return;}
  State.user=data.user;
  loadData();
  closeModal('loginModal');
}

async function register(name,bio,email,password){
  const { data, error } = await supabase.auth.signUp({ email,password });
  if(error){alert(error.message);return;}
  await supabase.from('users').insert([{id:data.user.id,name,bio,email}]);
  State.user=data.user;
  loadData();
  closeModal('registerModal');
}

// ===== Load Data =====
async function loadData(){
  if(!State.user) return;
  const { data: posts } = await supabase.from('posts').select('*').order('created_at',{ascending:false});
  const { data: comments } = await supabase.from('comments').select('*');
  const { data: missions } = await supabase.from('missions').select('*');
  const { data: rewards } = await supabase.from('rewards').select('*');

  State.posts=posts||[];
  State.comments=comments||[];
  State.missions=missions||[];
  State.rewards=rewards||[];

  renderProfile();
  renderFeed();
}

// ===== Render Profile =====
async function renderProfile(){
  if(!State.user) return;
  const { data:userData } = await supabase.from('users').select('*').eq('id',State.user.id).single();
  if(!userData) return;
  document.getElementById('profileName').textContent=userData.name;
  document.getElementById('profileBio').textContent=userData.bio;
}

// ===== Render Feed =====
function renderFeed(){
  const container=document.getElementById('feedContainer');
  const empty=document.getElementById('emptyState');
  if(!container||!empty) return;
  empty.style.display = State.posts.length ? 'none' : 'block';
  container.innerHTML='';
  State.posts.forEach(post=>{
    const div=document.createElement('div');
    div.className='glass p-4 mb-3';
    div.innerHTML=`<h3>${post.title}</h3><p>${post.content}</p>`;
    container.appendChild(div);
  });
}

// ===== Modals =====
function openModal(id){document.getElementById(id)?.classList.add('active');}
function closeModal(id){document.getElementById(id)?.classList.remove('active');}

// ===== DOM Events =====
document.addEventListener('DOMContentLoaded',()=>{
  applyConfig();
  initParticles();

  document.getElementById('userBtn').addEventListener('click',()=>openModal('loginModal'));
  document.getElementById('loginSubmitBtn').addEventListener('click',()=>login(
    document.getElementById('loginEmail').value,
    document.getElementById('loginPassword').value
  ));
  document.getElementById('registerSubmitBtn').addEventListener('click',()=>register(
    document.getElementById('registerName').value,
    document.getElementById('registerBio').value,
    document.getElementById('registerEmail').value,
    document.getElementById('registerPassword').value
  ));
  document.getElementById('switchLoginBtn').addEventListener('click',()=>{closeModal('registerModal');openModal('loginModal');});
  document.getElementById('switchRegisterBtn').addEventListener('click',()=>{closeModal('loginModal');openModal('registerModal');});
});
</script>
</body>
</html>
