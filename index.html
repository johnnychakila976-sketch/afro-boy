<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <!-- Ton HTML actuel ici (modals, feed, orders, missions, etc.) -->
</div>

<script>
  // ================= Supabase Setup =================
  const SUPABASE_URL = 'https://ccmjvekzbiykpbkzewic.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ispkTp-HmjtkM3Q6O1d39A_zLyOFOIC';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ================= Utilitaires =================
  function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return `il y a ${m}m`;
    const h = Math.floor(m / 60);
    if (h < 24) return `il y a ${h}h`;
    return `il y a ${Math.floor(h / 24)}j`;
  }

  // ================= State =================
  const State = {
    posts: [],
    comments: [],
    missions: [],
    orders: [],
    userPins: {},
    currentUser: null,
    mainMessage: null
  };

  // ================= Data SDK Supabase =================
  window.dataSdk = {
    async create(record) {
      try {
        let table = '';
        if (record.type) table = 'posts';
        else if (record.message_id) table = 'messages';
        else if (record.mission_id) table = 'missions';
        else if (record.comment_id) table = 'comments';
        else if (record.order_id) table = 'orders';
        if (!table) throw new Error('Record type unknown');

        const { data, error } = await supabase
          .from(table)
          .insert([{ ...record }])
          .select()
          .single();

        if (error) throw error;
        return { isOk: true, data };
      } catch (err) {
        return { isOk: false, isError: true, error: err };
      }
    },

    async update(record) {
      try {
        let table = '';
        if (record.type) table = 'posts';
        else if (record.message_id) table = 'messages';
        else if (record.mission_id) table = 'missions';
        else if (record.comment_id) table = 'comments';
        else if (record.order_id) table = 'orders';
        if (!table) throw new Error('Record type unknown');

        const { data, error } = await supabase
          .from(table)
          .update(record)
          .eq('__backendId', record.__backendId)
          .select()
          .single();

        if (error) throw error;
        return { isOk: true, data };
      } catch (err) {
        return { isOk: false, isError: true, error: err };
      }
    },

    async delete(record) {
      try {
        let table = '';
        if (record.type) table = 'posts';
        else if (record.message_id) table = 'messages';
        else if (record.mission_id) table = 'missions';
        else if (record.comment_id) table = 'comments';
        else if (record.order_id) table = 'orders';
        if (!table) throw new Error('Record type unknown');

        const { error } = await supabase
          .from(table)
          .delete()
          .eq('__backendId', record.__backendId);

        if (error) throw error;
        return { isOk: true };
      } catch (err) {
        return { isOk: false, isError: true, error: err };
      }
    },

    async init() {
      try {
        // Charger tous les posts, messages, commentaires
        const { data: posts } = await supabase.from('posts').select('*');
        const { data: messages } = await supabase.from('messages').select('*');
        const { data: comments } = await supabase.from('comments').select('*');
        const { data: missions } = await supabase.from('missions').select('*');
        const { data: orders } = await supabase.from('orders').select('*');

        State.posts = posts || [];
        State.comments = comments || [];
        State.missions = missions || [];
        State.orders = orders || [];
        State.messages = messages || [];

        Component.Feed.render(State.posts);
        Component.Missions.render(State.missions, State.currentUser?.phone || null);
        return { isOk: true };
      } catch (err) {
        console.error('Supabase init error:', err);
        return { isOk: false, isError: true, error: err };
      }
    }
  };

  // ================= Init =================
  document.addEventListener('DOMContentLoaded', async () => {
    // Récupérer l'utilisateur si déjà connecté
    const user = localStorage.getItem('currentUser');
    if (user) State.currentUser = JSON.parse(user);

    await window.dataSdk.init();

    // Appeler tes autres initialisations (Particles, Modals, Auth, etc.)
    if (Component.Particles) Component.Particles.init();
    if (Component.UserAuth) Component.UserAuth.updateDisplay();
    if (window.lucide) window.lucide.createIcons();
  });

</script>
<script src="app-components.js"></script> <!-- ton code HTML/JS pour Feed, Orders, Missions, etc. -->
</body>
</html>
