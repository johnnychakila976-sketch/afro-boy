<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFRO BOY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.35.0/dist/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.265.0/dist/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#0a0a0a; color:white; font-family:Outfit,sans-serif; }
.particle { width:6px; height:6px; background:#ff5555; border-radius:50%; position:absolute; animation-name:particleAnim; animation-iteration-count:infinite; }
@keyframes particleAnim { 0%{transform:translateY(0);} 100%{transform:translateY(-100px); opacity:0;} }
</style>
</head>
<body class="relative overflow-x-hidden">

<!-- PARTICLES -->
<div id="particleContainer" class="absolute inset-0 pointer-events-none"></div>

<div class="p-4 max-w-3xl mx-auto">
  <h1 id="profileName" class="text-3xl font-bold mb-2">AFRO BOY</h1>
  <p id="profileBio" class="mb-4">Bienvenue dans ton espace</p>

  <!-- AUTH -->
  <div id="authSection" class="mb-4 flex flex-wrap gap-2">
    <input id="phoneInput" placeholder="Numéro téléphone" class="p-2 text-black rounded flex-1">
    <input id="nameInput" placeholder="Nom" class="p-2 text-black rounded flex-1">
    <button id="registerBtn" class="bg-red-600 p-2 rounded">S'inscrire</button>
    <button id="loginBtn" class="bg-green-600 p-2 rounded">Se connecter</button>
  </div>

  <!-- STARS -->
  <div id="userStarsDisplay" class="mb-4 text-yellow-400 font-bold text-lg">Étoiles: 0</div>

  <!-- POSTS -->
  <h2 class="text-xl font-semibold mb-2">Posts</h2>
  <div id="postsContainer" class="mb-6 space-y-2"></div>

  <!-- MISSIONS -->
  <h2 class="text-xl font-semibold mb-2">Missions</h2>
  <div id="missionsContainer" class="mb-6 space-y-2"></div>
</div>

<script>
// ======================
// INIT SUPABASE
// ======================
const supabaseUrl = 'https://ccmjvekzbiykpbkzewic.supabase.co';
const supabaseKey = 'sb_publishable_ispkTp-HmjtkM3Q6O1d39A_zLyOFOIC';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// ======================
// STATE
// ======================
const State = {
  posts: [],
  missions: [],
  currentUser: null
};

// ======================
// USER AUTH
// ======================
async function registerUser() {
  const phone = document.getElementById('phoneInput').value;
  const name = document.getElementById('nameInput').value;
  if(!phone || !name){ alert('Remplis tous les champs'); return; }
  const { data, error } = await supabase.from('users').insert([{ phone, name, stars:0 }]).select().single();
  if(error){ alert(error.message); return; }
  State.currentUser = data;
  updateUserStars();
  alert('Utilisateur enregistré ✅');
}

async function loginUser() {
  const phone = document.getElementById('phoneInput').value;
  if(!phone){ alert('Remplis le numéro'); return; }
  const { data, error } = await supabase.from('users').select('*').eq('phone', phone).single();
  if(error){ alert(error.message); return; }
  State.currentUser = data;
  updateUserStars();
  alert('Utilisateur connecté ✅');
}

function updateUserStars(){
  const usd = document.getElementById('userStarsDisplay');
  if(State.currentUser && usd) usd.textContent = `Étoiles: ${State.currentUser.stars}`;
}

// ======================
// POSTS
// ======================
async function loadPosts() {
  const { data, error } = await supabase.from('posts').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); return; }
  State.posts = data;
  renderPosts();
}

function renderPosts(){
  const container = document.getElementById('postsContainer');
  container.innerHTML = '';
  State.posts.forEach(post=>{
    const liked = post.liked_by?.includes(State.currentUser?.phone) || false;
    container.innerHTML += `
      <div class="bg-gray-800 p-3 rounded-md shadow-md flex justify-between items-center">
        <p>${post.content}</p>
        <div>
          <button class="text-lg" style="color:${liked?'red':'#ccc'}" onclick="likePost('${post.id}')">❤️ ${post.likes||0}</button>
        </div>
      </div>
    `;
  });
}

async function likePost(id){
  if(!State.currentUser){ alert('Connecte-toi pour liker!'); return; }
  const post = State.posts.find(p=>p.id===id);
  let liked_by = post.liked_by || [];
  if(liked_by.includes(State.currentUser.phone)){
    liked_by = liked_by.filter(p=>p!==State.currentUser.phone);
    post.likes = Math.max(0, (post.likes||0)-1);
  } else {
    liked_by.push(State.currentUser.phone);
    post.likes = (post.likes||0)+1;
  }
  const { data, error } = await supabase.from('posts').update({likes:post.likes, liked_by}).eq('id', id);
  if(error){ console.error(error); return; }
  renderPosts();
}

// ======================
// MISSIONS
// ======================
async function loadMissions(){
  const { data, error } = await supabase.from('missions').select('*');
  if(error){ console.error(error); return; }
  State.missions = data;
  renderMissions();
}

function renderMissions(){
  const container = document.getElementById('missionsContainer');
  container.innerHTML = '';
  State.missions.forEach(m=>{
    const completed = m.completed_by?.includes(State.currentUser?.phone) || false;
    container.innerHTML += `
      <div class="bg-gray-800 p-3 rounded-md shadow-md flex justify-between items-center">
        <span>${m.title} - ${m.points} points</span>
        <button class="ml-2 px-2 py-1 rounded bg-red-600" onclick="completeMission('${m.id}')">${completed ? '✅ Complété' : 'Compléter'}</button>
      </div>
    `;
  });
}

async function completeMission(id){
  if(!State.currentUser){ alert('Connecte-toi!'); return; }
  const mission = State.missions.find(m=>m.id===id);
  let completed_by = mission.completed_by || [];
  if(!completed_by.includes(State.currentUser.phone)){
    completed_by.push(State.currentUser.phone);
    mission.completed_by = completed_by;
    const { data, error } = await supabase.from('missions').update({completed_by}).eq('id', id);
    if(error){ console.error(error); return; }
    State.currentUser.stars += mission.points;
    await supabase.from('users').update({stars:State.currentUser.stars}).eq('phone', State.currentUser.phone);
    updateUserStars();
    renderMissions();
  }
}

// ======================
// PARTICLES
// ======================
function initParticles(){
  const c = document.getElementById('particleContainer');
  for(let i=0;i<15;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.bottom='0';
    p.style.animationDelay=Math.random()*4+'s';
    p.style.animationDuration=(3+Math.random()*3)+'s';
    c.appendChild(p);
  }
}

// ======================
// EVENTS
// ======================
document.getElementById('registerBtn').addEventListener('click', registerUser);
document.getElementById('loginBtn').addEventListener('click', loginUser);

// ======================
// INIT APP
// ======================
async function initApp(){
  await loadPosts();
  await loadMissions();
  initParticles();
}
initApp();
</script>
</body>
</html>
